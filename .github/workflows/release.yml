name: Beta release readiness

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact beta version already committed in the selected ref
        type: string
        required: true
      expected_sha256:
        description: SHA-256 of the locally reviewed deterministic package
        type: string
        required: true

# This workflow verifies readiness. It cannot publish a release, push or deploy.
permissions:
  contents: read

jobs:
  package:
    name: Verify version and package identity
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Build and verify the exact reviewed beta
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          EXPECTED_SHA256: ${{ inputs.expected_sha256 }}
        run: python .github/scripts/release-package.py "$RUNNER_TEMP/release-proof.zip"

  compatibility:
    name: Full release compatibility proof
    needs: package
    uses: ./.github/workflows/ci.yml
    with:
      full_checks: true
