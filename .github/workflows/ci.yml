name: CI

on:
  pull_request:
  push:
    branches: [main, develop, cache-cache]
  workflow_dispatch:
    inputs:
      full_checks:
        description: Run all groups, including disposable server and worker proof
        type: boolean
        default: true
  workflow_call:
    inputs:
      full_checks:
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  scope:
    name: Select checks and record revision
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    outputs:
      wordpress: ${{ steps.scope.outputs.wordpress }}
      browser: ${{ steps.scope.outputs.browser }}
      server: ${{ steps.scope.outputs.server }}
      head: ${{ steps.scope.outputs.head }}
      base: ${{ steps.scope.outputs.base }}
      candidate: ${{ steps.scope.outputs.candidate }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - id: scope
        env:
          FULL_CHECKS: ${{ inputs.full_checks || false }}
        run: |
          python3 .github/scripts/ci-scope.py --self-test
          python3 .github/scripts/ci-scope.py

  fast:
    name: Fast checks
    needs: scope
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.scope.outputs.candidate }}
          fetch-depth: 0
          persist-credentials: false
      - uses: shivammathur/setup-php@bf6b4fbd49ca58e4608c9c89fba0b8d90bd2a39f # 2.35.5
        with:
          php-version: '8.3'
          extensions: mbstring, mysqli, dom, gd, curl, zip
          coverage: none
          tools: composer:2.8.12
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install check dependencies and verified WordPress core
        env:
          COMPOSER_HOME: ${{ runner.temp }}/cache-cache-composer
        run: |
          python -m pip install --quiet -r tools/requirements.txt
          npm ci --prefix tools --no-audit --no-fund
          composer install --working-dir=tools/php-quality --no-interaction --no-plugins --no-scripts --prefer-dist --no-progress
          sh .github/scripts/download-wordpress.sh 7.1.3 "$RUNNER_TEMP/fast-core"
      - name: Verify current guides, syntax, isolated regressions and generated output
        run: |
          python tools/check.py docs
          python tools/check.py syntax --php php --node node
          python tools/check.py fast --fixture php-quality --php php
          python tools/check.py quality --php php --base "${{ needs.scope.outputs.base }}" --head "${{ needs.scope.outputs.candidate }}"
          python tools/check.py fast --php php --wordpress "$RUNNER_TEMP/fast-core/wordpress"
          python tools/check.py generated --node node

  wordpress:
    name: WordPress PHP ${{ matrix.php }} / WP ${{ matrix.wordpress }}
    needs: scope
    if: needs.scope.outputs.wordpress == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '7.4'
            wordpress: '5.8'
          - php: '8.3'
            wordpress: '7.1.3'
    services:
      database:
        image: mariadb:11.4
        env:
          MARIADB_DATABASE: cachecache
          MARIADB_USER: cachecache
          MARIADB_PASSWORD: disposable-ci
          MARIADB_ROOT_PASSWORD: disposable-ci-root
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.scope.outputs.candidate }}
          fetch-depth: 0
          persist-credentials: false
      - uses: shivammathur/setup-php@bf6b4fbd49ca58e4608c9c89fba0b8d90bd2a39f # 2.35.5
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, mysqli, dom, gd, curl, zip
          coverage: none
          tools: composer:2.8.12
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Verify changed maintained PHP at the product syntax floor
        if: matrix.php == '7.4'
        env:
          COMPOSER_HOME: ${{ runner.temp }}/cache-cache-composer
        run: |
          composer install --working-dir=tools/php-quality --no-interaction --no-plugins --no-scripts --prefer-dist --no-progress
          python tools/check.py fast --fixture php-quality --php php
          python tools/check.py quality --php php --base "${{ needs.scope.outputs.base }}" --head "${{ needs.scope.outputs.candidate }}"
      - name: Create isolated native WordPress site
        env:
          WORDPRESS_VERSION: ${{ matrix.wordpress }}
        run: sh .github/scripts/setup-wordpress.sh "$GITHUB_WORKSPACE" "$WORDPRESS_VERSION" "$RUNNER_TEMP/native"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Native settings and lifecycle proof, serial in one disposable site
        env:
          PHP_VERSION: ${{ matrix.php }}
        run: |
          php --version | head -n 1
          if [ "$PHP_VERSION" = 7.4 ]; then
            # Full bundled-source syntax runs in the PHP 8.3 fast job. This
            # pair proves the native paths below, including loaded dependencies.
            args=()
            for phase in activate boot hooks settings import import-validation render cdn minify-purge release-update health abilities branding; do
              args+=(--fixture "acceptance:$phase")
            done
            python tools/check.py wordpress --php php --wordpress "$RUNNER_TEMP/native/wordpress" "${args[@]}" --fixture wordpress-preload-discovery --fixture wordpress-revision-invalidation --fixture wordpress-query-cache-invalidation --fixture wordpress-bootstrap-construction --fixture wordpress-database-eligibility --fixture wordpress-database-transients --fixture wordpress-tools-action-feedback
            python tools/check.py wordpress --php php --wordpress "$RUNNER_TEMP/native/wordpress" --fixture cache-purge-boundaries --fixture wordpress-cache-purge-boundaries
            echo 'Minimum pair: native activation/settings/update/ownership lifecycle, simultaneous preload discovery, revision invalidation, query-cache generations, startup construction, cleanup category revalidation and persisted transient cleanup. Full bundled-source syntax runs on PHP 8.3; current-only fixture APIs are not claimed on this pair.' >> "$GITHUB_STEP_SUMMARY"
          else
            python tools/check.py wordpress --php php --wordpress "$RUNNER_TEMP/native/wordpress"
          fi
          python tools/check.py wordpress --php php --wordpress "$RUNNER_TEMP/native/wordpress" --fixture acceptance:veto --fixture acceptance:deactivate --fixture acceptance:uninstall --fixture acceptance:collision --fixture acceptance:restore

  browser:
    name: Browser regression checks
    needs: scope
    if: needs.scope.outputs.browser == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.scope.outputs.candidate }}
          persist-credentials: false
      - uses: shivammathur/setup-php@bf6b4fbd49ca58e4608c9c89fba0b8d90bd2a39f # 2.35.5
        with:
          php-version: '8.3'
          extensions: mbstring, dom, gd, curl, zip
          coverage: none
          tools: none
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Prepare standalone browser fixtures
        run: |
          npm ci --prefix noobrocket/local-css --no-audit --no-fund
          sh .github/scripts/download-wordpress.sh 7.1.3 "$RUNNER_TEMP/browser-core"
      - name: Exercise affected settings, delivery and browser interactions
        run: |
          browser=$(command -v google-chrome || command -v chromium)
          "$browser" --version
          python3 tools/check.py browser --php php --node node --chromium "$browser" --wordpress "$RUNNER_TEMP/browser-core/wordpress"

  server:
    name: Linux server and worker proof
    needs: scope
    if: needs.scope.outputs.server == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.scope.outputs.candidate }}
          persist-credentials: false
      - uses: shivammathur/setup-php@bf6b4fbd49ca58e4608c9c89fba0b8d90bd2a39f # 2.35.5
        with:
          php-version: '8.3'
          extensions: mbstring, mysqli, dom, gd, curl, zip
          coverage: none
          tools: none
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install server prerequisites without using system services for proof
        run: |
          mkdir -p .artifacts/check-logs
          sudo apt-get update -qq > .artifacts/check-logs/server-install.log 2>&1
          if ! sudo apt-get install -y apache2 nginx mariadb-server php8.3-fpm >> .artifacts/check-logs/server-install.log 2>&1; then
            tail -n 40 .artifacts/check-logs/server-install.log
            exit 1
          fi
          sudo systemctl stop apache2 nginx mariadb php8.3-fpm
          npm ci --prefix noobrocket/local-css --no-audit --no-fund
          sh .github/scripts/download-wordpress.sh 7.1.3 "$RUNNER_TEMP/server-core"
      - name: Prove owned MariaDB, Apache/FPM, Nginx, Chromium worker and multisite paths
        env:
          PHP_FPM: /usr/sbin/php-fpm8.3
        run: |
          browser=$(command -v google-chrome || command -v chromium)
          "$browser" --version
          python3 tools/check.py server --php php --node node --chromium "$browser" --wordpress-zip "$RUNNER_TEMP/server-core/wordpress.zip"

  checks:
    name: Required checks
    needs: [scope, fast, wordpress, browser, server]
    if: always()
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Resolve every applicable group
        env:
          CHECK_RESULTS: ${{ toJSON(needs) }}
        run: python3 .github/scripts/ci-result.py
